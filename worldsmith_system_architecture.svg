<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
    <linearGradient id="client" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#162d4a"/>
    </linearGradient>
    <linearGradient id="server" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d2b0a"/>
      <stop offset="100%" stop-color="#2a1d06"/>
    </linearGradient>
    <linearGradient id="data" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a3320"/>
      <stop offset="100%" stop-color="#122418"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrowDown" markerWidth="10" markerHeight="8" refX="5" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8" fill="#f59e0b" opacity="0.7"/>
    </marker>
    <marker id="arrowUp" markerWidth="10" markerHeight="8" refX="5" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L10,4 L0,8" fill="#60a5fa" opacity="0.5"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" fill="#f59e0b" font-size="20" font-weight="700" letter-spacing="2">WORLDSMITH SYSTEM ARCHITECTURE</text>
  <line x1="250" y1="50" x2="650" y2="50" stroke="#f59e0b" stroke-width="0.5" opacity="0.3"/>

  <!-- ==================== CLIENT LAYER ==================== -->
  <rect x="40" y="70" width="820" height="170" rx="10" fill="url(#client)" filter="url(#shadow)" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="60" y="98" fill="#60a5fa" font-size="14" font-weight="700" letter-spacing="1">CLIENT LAYER</text>
  <text x="60" y="114" fill="#94a3b8" font-size="10">React + Vite + TypeScript | Zustand | Tailwind CSS</text>

  <!-- ChatPanel -->
  <rect x="60" y="128" width="155" height="90" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.3"/>
  <text x="137" y="155" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">ChatPanel</text>
  <text x="137" y="172" text-anchor="middle" fill="#64748b" font-size="9">角色扮演 / 文字冒险</text>
  <text x="137" y="185" text-anchor="middle" fill="#64748b" font-size="9">群聊剧场</text>
  <text x="137" y="198" text-anchor="middle" fill="#64748b" font-size="9">模式切换 | SSE 流式</text>

  <!-- GmPanel -->
  <rect x="230" y="128" width="155" height="90" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.3"/>
  <text x="307" y="155" text-anchor="middle" fill="#fcd34d" font-size="12" font-weight="600">GmPanel</text>
  <text x="307" y="172" text-anchor="middle" fill="#64748b" font-size="9">GM Agent 对话</text>
  <text x="307" y="185" text-anchor="middle" fill="#64748b" font-size="9">状态栏展示</text>
  <text x="307" y="198" text-anchor="middle" fill="#64748b" font-size="9">Outcome 选择</text>

  <!-- MapPanel -->
  <rect x="400" y="128" width="155" height="90" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1" stroke-opacity="0.3"/>
  <text x="477" y="155" text-anchor="middle" fill="#86efac" font-size="12" font-weight="600">MapPanel</text>
  <text x="477" y="172" text-anchor="middle" fill="#64748b" font-size="9">SVG 自绘地图</text>
  <text x="477" y="185" text-anchor="middle" fill="#64748b" font-size="9">导演模式拖拽</text>
  <text x="477" y="198" text-anchor="middle" fill="#64748b" font-size="9">弹窗式 | 地点 / 连线</text>

  <!-- CharacterPanel + Dialogs -->
  <rect x="570" y="128" width="120" height="90" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="1" stroke-opacity="0.3"/>
  <text x="630" y="155" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="600">Character</text>
  <text x="630" y="172" text-anchor="middle" fill="#64748b" font-size="9">角色库 / 角色卡</text>
  <text x="630" y="185" text-anchor="middle" fill="#64748b" font-size="9">板块编辑器</text>
  <text x="630" y="198" text-anchor="middle" fill="#64748b" font-size="9">人设 / 规则</text>

  <!-- appStore -->
  <rect x="705" y="128" width="135" height="90" rx="6" fill="#0f172a" stroke="#f97316" stroke-width="1" stroke-opacity="0.3"/>
  <text x="772" y="152" text-anchor="middle" fill="#fdba74" font-size="12" font-weight="600">appStore</text>
  <text x="772" y="167" text-anchor="middle" fill="#64748b" font-size="9">Zustand</text>
  <line x1="715" y1="175" x2="830" y2="175" stroke="#334155" stroke-width="0.5"/>
  <text x="772" y="190" text-anchor="middle" fill="#64748b" font-size="9">世界/角色/对话/地图</text>
  <text x="772" y="203" text-anchor="middle" fill="#64748b" font-size="9">GM/状态/规则</text>

  <!-- ==================== ARROWS ==================== -->
  <line x1="350" y1="242" x2="350" y2="272" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowDown)" opacity="0.6"/>
  <line x1="550" y1="242" x2="550" y2="272" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowDown)" opacity="0.6"/>
  <text x="450" y="262" text-anchor="middle" fill="#f59e0b" font-size="10" opacity="0.7">HTTP / SSE</text>

  <!-- ==================== SERVER LAYER ==================== -->
  <rect x="40" y="278" width="820" height="175" rx="10" fill="url(#server)" filter="url(#shadow)" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="60" y="306" fill="#f59e0b" font-size="14" font-weight="700" letter-spacing="1">SERVER LAYER</text>
  <text x="60" y="322" fill="#94a3b8" font-size="10">Express 4 + TypeScript (ESM) | x-world-id header</text>

  <!-- Routes -->
  <rect x="60" y="336" width="155" height="100" rx="6" fill="#1c1404" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.25"/>
  <text x="137" y="360" text-anchor="middle" fill="#fcd34d" font-size="12" font-weight="600">Routes</text>
  <text x="137" y="378" text-anchor="middle" fill="#94a3b8" font-size="9">chat / gm / characters / cards</text>
  <text x="137" y="391" text-anchor="middle" fill="#94a3b8" font-size="9">conversations / worlds / rules</text>
  <text x="137" y="404" text-anchor="middle" fill="#94a3b8" font-size="9">locations / knowledge / lore</text>
  <text x="137" y="417" text-anchor="middle" fill="#94a3b8" font-size="9">llm / personas / player / char-state</text>

  <!-- Chat Service -->
  <rect x="230" y="336" width="155" height="100" rx="6" fill="#1c1404" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.25"/>
  <text x="307" y="360" text-anchor="middle" fill="#fcd34d" font-size="12" font-weight="600">Chat Service</text>
  <text x="307" y="378" text-anchor="middle" fill="#94a3b8" font-size="9">上下文组装 (context.ts)</text>
  <text x="307" y="391" text-anchor="middle" fill="#94a3b8" font-size="9">角色卡哈希缓存</text>
  <text x="307" y="404" text-anchor="middle" fill="#94a3b8" font-size="9">记忆注入 | 人设注入</text>
  <text x="307" y="417" text-anchor="middle" fill="#94a3b8" font-size="9">世界规则注入 | SSE</text>

  <!-- GM Service -->
  <rect x="400" y="336" width="155" height="100" rx="6" fill="#1c1404" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.25"/>
  <text x="477" y="360" text-anchor="middle" fill="#fcd34d" font-size="12" font-weight="600">GM Service</text>
  <text x="477" y="378" text-anchor="middle" fill="#94a3b8" font-size="9">Agent 对话循环</text>
  <text x="477" y="391" text-anchor="middle" fill="#94a3b8" font-size="9">Function Calling</text>
  <text x="477" y="404" text-anchor="middle" fill="#94a3b8" font-size="9">世界快照注入</text>
  <text x="477" y="417" text-anchor="middle" fill="#94a3b8" font-size="9">Outcome 管理</text>

  <!-- Skills -->
  <rect x="570" y="336" width="130" height="100" rx="6" fill="#1c1404" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.25"/>
  <text x="635" y="360" text-anchor="middle" fill="#fcd34d" font-size="12" font-weight="600">Skills</text>
  <text x="635" y="378" text-anchor="middle" fill="#94a3b8" font-size="9">roll_attack / roll_d20</text>
  <text x="635" y="391" text-anchor="middle" fill="#94a3b8" font-size="9">create_location / quest</text>
  <text x="635" y="404" text-anchor="middle" fill="#94a3b8" font-size="9">update_player_state</text>
  <text x="635" y="417" text-anchor="middle" fill="#94a3b8" font-size="9">world_rules CRUD</text>

  <!-- Memory -->
  <rect x="715" y="336" width="125" height="100" rx="6" fill="#1c1404" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.25"/>
  <text x="777" y="360" text-anchor="middle" fill="#fcd34d" font-size="12" font-weight="600">Memory</text>
  <text x="777" y="378" text-anchor="middle" fill="#94a3b8" font-size="9">后台提取</text>
  <text x="777" y="391" text-anchor="middle" fill="#94a3b8" font-size="9">LIKE 子串匹配</text>
  <text x="777" y="404" text-anchor="middle" fill="#94a3b8" font-size="9">应用层评分</text>
  <text x="777" y="417" text-anchor="middle" fill="#94a3b8" font-size="9">自动压缩摘要</text>

  <!-- ==================== ARROWS ==================== -->
  <line x1="350" y1="455" x2="350" y2="485" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowDown)" opacity="0.6"/>
  <line x1="550" y1="455" x2="550" y2="485" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowDown)" opacity="0.6"/>
  <text x="450" y="475" text-anchor="middle" fill="#22c55e" font-size="10" opacity="0.7">Drizzle ORM / OpenAI API</text>

  <!-- ==================== DATA LAYER ==================== -->
  <rect x="40" y="492" width="820" height="108" rx="10" fill="url(#data)" filter="url(#shadow)" stroke="#22c55e" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="60" y="518" fill="#22c55e" font-size="14" font-weight="700" letter-spacing="1">DATA LAYER</text>
  <text x="60" y="534" fill="#94a3b8" font-size="10">better-sqlite3 (WAL) | OpenAI 兼容协议</text>

  <!-- SQLite -->
  <rect x="60" y="546" width="240" height="38" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1" stroke-opacity="0.25"/>
  <text x="180" y="570" text-anchor="middle" fill="#86efac" font-size="12" font-weight="600">SQLite (worldsmith.db)</text>

  <!-- Tables -->
  <rect x="320" y="546" width="280" height="38" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1" stroke-opacity="0.25"/>
  <text x="460" y="566" text-anchor="middle" fill="#94a3b8" font-size="9">worlds | characters | conversations | messages</text>
  <text x="460" y="578" text-anchor="middle" fill="#94a3b8" font-size="9">gm_messages | locations | knowledge | rules | player_states</text>

  <!-- LLM Providers -->
  <rect x="620" y="546" width="220" height="38" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.25"/>
  <text x="730" y="566" text-anchor="middle" fill="#60a5fa" font-size="10" font-weight="600">LLM Providers</text>
  <text x="730" y="578" text-anchor="middle" fill="#64748b" font-size="9">OpenAI / DeepSeek / Anthropic / Ollama</text>

  <!-- Footer -->
  <text x="450" y="614" text-anchor="middle" fill="#475569" font-size="9">LLM = Narrative &amp; Dialog | Code Engine = Deterministic Facts</text>
</svg>